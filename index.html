<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#142c2c">
  <meta name="description" content="La Moncloa: un simulador político 3D. Gobierna, pacta, decide y vuelve a ganarte el voto. Un juego gratuito y sin conexión.">
  <title>La Moncloa · Simulador de presidencia</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script defer src="vendor/three.min.js"></script>
  <script defer src="data.js"></script>
  <script defer src="engine.js"></script>
  <script defer src="scene.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Ir al juego</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegación principal">
      <a class="brand" href="#resumen"><span class="brand-mark"><i></i><i></i><i></i></span><span>LA MONCLOA<small>SIMULADOR DE PRESIDENCIA</small></span></a>
      <div class="sidebar-term"><span class="live-dot"></span><span id="sidebar-term">XVI LEGISLATURA</span><small>GOBIERNO DE ESPAÑA</small></div>
      <nav id="navigation"></nav>
      <div class="sidebar-bottom"><div class="flag-line"></div><p>El poder dura un mandato.<br><strong>Las decisiones, una historia.</strong></p><button class="sidebar-settings" data-action="settings"><span>⚙</span> Ajustes y partida</button></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb"><span class="tiny-emblem">▥</span> Gobierno de España <span>/</span> <strong id="breadcrumb">Centro de mando</strong></div>
        <div class="topbar-tools"><span class="save-indicator" id="save-indicator"><i></i> Partida guardada</span><button class="icon-button" data-action="help" aria-label="Cómo jugar">?</button><button class="avatar" data-action="profile" id="avatar" aria-label="Perfil de la presidencia">AM</button></div>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer class="game-footer"><span>LA MONCLOA <span class="footer-sep">/</span> El país que construyas, será tu legado.</span><span>Simulación ficticia · v1.0</span></footer>
    </div>
  </div>
  <div class="mobile-command" id="mobile-command" aria-label="Control del turno"></div>
  <nav class="mobile-nav" id="mobile-navigation" aria-label="Navegación móvil"></nav>
  <div class="toast-stack" id="toasts" aria-live="polite"></div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript><div class="noscript">Activa JavaScript para jugar a La Moncloa. No necesitas instalar nada ni tener conexión a internet.</div></noscript>
</body>
</html>
